[project]
name = "featurestore-lite"
version = "0.1.0"
description = "A small feature store: point-in-time-correct training joins, TTLs, materialisation to an online store, and a FastAPI serving layer, built on SQLite"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kilian Minkwitz" }]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/featurestore"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
